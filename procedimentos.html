		<!-- Formulário que envia os dados para o PHP -->
		<form action="processar_agendamento.php" method="POST">
			<!-- Campo oculto para identificar que é um Procedimento -->
			<input type="hidden" name="tipo" value="Procedimento">

			<div class="listas">
				<h2>Procedimentos:</h2>
				<ul>
					<li><input type="radio" name="profissional_ou_procedimento" value="Curativo" required> Curativo</li>

					<li><input type="radio" name="horario" value="10:30"> 10:30</li>
					<li><input type="radio" name="horario" value="12:30"> 12:30</li>
					<li><input type="radio" name="horario" value="14:00"> 14:00</li>
					<li><input type="radio" name="horario" value="15:30"> 15:30</li>
					<li><input type="radio" name="horario" value="17:00"> 17:00</li>
				</ol>
				<br>
				<label for="dataConsulta"><strong>Data do Procedimento:</strong></label>
				<br>
				<input type="date" id="dataConsulta" name="data_agendamento" required>
				<br><br>

				<button id="butao" type="submit">Enviar</button>
			</div>
